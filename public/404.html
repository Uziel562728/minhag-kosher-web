<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Minhag Kosher</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script checks if there is a redirect in the lookup table
      // and redirects the user back to the correct path.
      var firstSegment = window.location.pathname.split('/').filter(Boolean)[0];
      var pathSegmentsToKeep = (firstSegment && !['admin', 'catalog', 'products', 'login', 'cart'].includes(firstSegment)) ? 1 : 0;

      var l = window.location;
      var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
        '/?p=' + l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash;
      l.replace(redirectUrl);
    </script>
  </head>
  <body>
  </body>
</html>
