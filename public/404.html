<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Minhag Kosher</title>
    <script>
      (function redirectSinglePageApp() {
        var location = window.location;
        var localHosts = ['localhost', '127.0.0.1', '::1'];
        if (localHosts.indexOf(location.hostname) !== -1) return;

        var segments = location.pathname.split('/').filter(Boolean);
        var isGitHubPages = location.hostname.endsWith('.github.io');
        var repositoryBase = isGitHubPages && segments.length > 0 ? '/' + segments[0] : '';
        var route = segments.slice(repositoryBase ? 1 : 0).join('/');
        var redirectUrl = location.origin + repositoryBase + '/?p=' + encodeURIComponent(route);

        if (location.search) {
          redirectUrl += '&q=' + encodeURIComponent(location.search.slice(1));
        }

        location.replace(redirectUrl + location.hash);
      })();
    </script>
  </head>
  <body>
    <p>No se encontró la página solicitada.</p>
  </body>
</html>
